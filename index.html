<!DOCTYPE html>

    <title></title>
    <style>
        html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000000 !important;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

        .loader {
            width: 70px;
            height: 70px;
            border: 6px solid #eeeeee;
            border-top: 6px solid #0066ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        video, canvas { display: none; }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }

        .error-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 360px;
        }
        .error-icon { font-size: 70px; margin-bottom: 10px; }
        .error-title { font-size: 23px; font-weight: bold; }
        .error-text { font-size: 15.5px; color: #444; line-height: 1.4; }
        .reload-btn {
            background: #0066ff;
            color: white;
            border: none;
            padding: 14px 50px;
            font-size: 17px;
            border-radius: 50px;
            margin-top: 25px;
            cursor: pointer;
        }
    </style>
</head>
